name: Release

# Publishes typescript_local_ai to npm when a GitHub release is published.
# The release tag must match package.json (`v0.1.0` or `0.1.0`). Prerelease
# versions (e.g. 0.2.0-beta.1) are published under the `next` dist-tag.
#
# Publishing uses npm Trusted Publishing (OIDC) with provenance, so no npm
# token is stored. One-time setup on npmjs.com → package settings → Trusted
# Publisher: GitHub Actions, owner kekko7072, repository typescript_local_ai,
# workflow release.yml, environment npm. For the very first publish of a new
# package, see "Releasing" in the README.
#
# Run it manually (Actions → Release → Run workflow) for a dry run that runs
# every check and `npm publish --dry-run` without uploading.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  dry-run:
    name: Publish dry run
    if: github.event_name != 'release'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check release tag matches package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$version'"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Refuse to republish an existing version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "typescript_local_ai@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "::error::typescript_local_ai@$VERSION is already on npm"
            exit 1
          fi

      - run: npm publish --dry-run --tag ${{ steps.version.outputs.dist_tag }}

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate every release.
    environment:
      name: npm
      url: https://www.npmjs.com/package/typescript_local_ai
    permissions:
      contents: read
      id-token: write   # Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check release tag matches package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$version'"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Refuse to republish an existing version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "typescript_local_ai@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "::error::typescript_local_ai@$VERSION is already on npm"
            exit 1
          fi

      - name: Publish
        env:
          # Optional: only needed for the very first publish, before the
          # package exists on npm and a Trusted Publisher can be configured.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          npm publish --provenance --access public --tag ${{ steps.version.outputs.dist_tag }}
